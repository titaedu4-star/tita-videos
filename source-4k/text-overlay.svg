<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 640 360"><text x="332" y="111" font-family="Liberation Sans" font-size="16" fill="#54aa9d" opacity="1">part 1</text><text x="332" y="141" font-family="Liberation Sans" font-size="20" font-weight="bold" fill="#f2f2f2" opacity="1">A timetable is one of the most</text><text x="332" y="164" font-family="Liberation Sans" font-size="20" font-weight="bold" fill="#f2f2f2" opacity="1">critical documents that</text><text x="332" y="187" font-family="Liberation Sans" font-size="20" font-weight="bold" fill="#f2f2f2" opacity="1">kickstarts academic activities</text><text x="332" y="210" font-family="Liberation Sans" font-size="20" font-weight="bold" fill="#f2f2f2" opacity="1">in tertiary institutions.</text></svg>